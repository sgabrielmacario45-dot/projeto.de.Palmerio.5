<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de disciplina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <h1>Quiz de tecnologia</h1>
    <div id="quiz">
      <p id="progresso"></p>
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="proxima" disabled>Próxima pergunta</button>
    </div>
    <div id="resultado" hidden></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
